version: 2
updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
      - "maximemichaud"
    reviewers:
      - "maximemichaud"

  # Python/pip dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
      - "maximemichaud"
    reviewers:
      - "maximemichaud"
    
    # Limit maximum open PRs
    open-pull-requests-limit: 10
    
    # PR labels configuration
    labels:
      - "dependencies"
      - "python"
          
    # Versioning strategy
    versioning-strategy: "auto"
    # Commit message configuration
    commit-message:
      prefix: "deps"
      prefix-development: "dev-deps"