name: Django CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        include:
          - python-version: "3.13"
            experimental: false
          - python-version: "3.14"
            experimental: true

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_deepweb_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/requirements.txt

    - name: Create .env file
      run: |
        echo "SECRET_KEY=test-secret-key-for-ci-only" > src/.env
        echo "DEBUG=True" >> src/.env
        echo "DB_NAME=test_deepweb_db" >> src/.env
        echo "DB_USER=postgres" >> src/.env
        echo "DB_PASSWORD=postgres" >> src/.env
        echo "DB_HOST=localhost" >> src/.env
        echo "DB_PORT=5432" >> src/.env

    - name: Check Django setup
      run: |
        cd src
        python manage.py check

    - name: Run migrations
      run: |
        cd src
        python manage.py migrate

    - name: Run pytest tests
      run: |
        cd src
        pytest --cov=deepweb --cov-report=term

