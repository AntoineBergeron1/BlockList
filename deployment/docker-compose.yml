services:
  # PostgreSQL 18 - Base de données principale
  db:
    image: postgres:18-alpine
    container_name: deepweb_postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      #- ./backups:/backups  # Pour les sauvegardes
    environment:
      POSTGRES_DB: ${DB_NAME:-deepweb_db}
      POSTGRES_USER: ${DB_USER:-deepweb_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      # Optimisations PostgreSQL pour les types IP (UTF8 international)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    networks:
      - deepweb_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-deepweb_user} -d ${DB_NAME:-deepweb_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django 5.2 LTS avec Python 3.13
  web:
    image: python:3.13
    container_name: deepweb_django
    restart: unless-stopped
    working_dir: /app
    command: /app/deployment/entrypoint.sh
    volumes:
      - ../:/app
      - /app/.venv
      - /app/node_modules
    environment:
      # Django settings
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}

      # Database settings
      DB_NAME: ${DB_NAME:-deepweb_db}
      DB_USER: ${DB_USER:-deepweb_user}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_HOST: db
      DB_PORT: 5432

      # MaxMind GeoIP2
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}

      # Redis cache (désactivé pour le moment)
      # REDIS_URL: redis://redis:6379/1

      # Email settings (optionnel)
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      # redis:
      #   condition: service_started
    networks:
      - deepweb_network
    stdin_open: true
    tty: true

  # Redis pour le cache et les sessions (désactivé pour le moment)
  # À décommenter quand nécessaire pour la performance
  # redis:
  #   image: redis:7-alpine
  #   container_name: deepweb_redis
  #   restart: unless-stopped
  #   command: redis-server --appendonly yes
  #   volumes:
  #     - redis_data:/data
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - deepweb_network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Nginx pour servir les fichiers statiques et comme reverse proxy
  nginx:
    image: nginx:alpine
    container_name: deepweb_nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../src/static:/usr/share/nginx/html/static:ro
      - ../src/media:/usr/share/nginx/html/media:ro
      - ../logs/nginx:/var/log/nginx
    ports:
      - "80:80"
      # - "443:443"  # HTTPS désactivé pour le moment
    depends_on:
      - web
    networks:
      - deepweb_network

  # PgAdmin pour la gestion de PostgreSQL (développement)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: deepweb_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - deepweb_network

  # Mailhog pour capturer les emails en développement
  # mailhog:
  #   image: mailhog/mailhog:latest
  #   container_name: deepweb_mailhog
  #   ports:
  #     - "1025:1025"  # SMTP
  #     - "8025:8025"  # Web UI
  #   networks:
  #     - deepweb_network

volumes:
  postgres_data:
    driver: local
  # redis_data:
  #   driver: local
  pgadmin_data:
    driver: local

networks:
  deepweb_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
