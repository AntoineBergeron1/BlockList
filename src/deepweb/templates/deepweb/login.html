{% extends "deepweb/base.html" %}

{% block contenu %}

    {% if form.errors %}
        <div class="alert alert-danger">
            {% for field, errors in form.errors.items %}
              {% for error in errors %}
                <p>{{ error }}</p>
              {% endfor %}
            {% endfor %}
        </div>
    {% endif %}

<form method="POST" novalidate id="loginForm">
{% csrf_token %}
{{form}}
<input class="btn btn-primary" type="submit" value="Se connecter">
</form>

{% if debug %}
<div class="mt-4">
    <p class="text-muted small">Quick Login (Development):</p>
    <button type="button" class="btn btn-sm me-2 quick-login-user" onclick="fillLogin('user', 'user123')">User Test</button>
    <button type="button" class="btn btn-sm quick-login-admin" onclick="fillLogin('admin', 'admin123')">Admin Test</button>
</div>

<style>
.quick-login-user {
    background-color: #007bff !important;
    border-color: #007bff !important;
    color: white !important;
}
.quick-login-user:hover {
    background-color: #0056b3 !important;
    border-color: #0056b3 !important;
}
.quick-login-admin {
    background-color: #dc3545 !important;
    border-color: #dc3545 !important;
    color: white !important;
}
.quick-login-admin:hover {
    background-color: #c82333 !important;
    border-color: #c82333 !important;
}
</style>

<script>
function fillLogin(username, password) {
    document.getElementById('id_username').value = username;
    document.getElementById('id_password').value = password;
}
</script>
{% endif %}

{% endblock %}
