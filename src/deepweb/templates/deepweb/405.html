{% extends "deepweb/base.html" %}

{% block title %}Erreur 405 - Méthode non autorisée{% endblock %}

{% block contenu %}
<div class="text-center py-5">
    <h1 class="display-1 text-danger">405</h1>
    <h2 class="mb-4">Méthode non autorisée</h2>
    <p class="lead text-muted mb-4">
        La méthode HTTP utilisée n'est pas autorisée pour cette ressource.
    </p>
    <a href="{% url 'index' %}" class="btn btn-primary">
        Retour à l'accueil
    </a>
</div>
{% endblock %}
